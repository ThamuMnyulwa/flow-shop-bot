# The tests run on every change before it can be released (E9).
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flowshop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      FLOWSHOP_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/flowshop_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - run: docker build -t floww-shop .

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.16"
      - run: terraform fmt -recursive -check terraform
      - name: Validate environments
        run: |
          for env in dev prod; do
            terraform -chdir=terraform/environments/$env init -backend=false -input=false
            terraform -chdir=terraform/environments/$env validate
          done
      - name: Module tests (mocked providers, no accounts)
        run: |
          terraform -chdir=terraform/modules/environment init -backend=false -input=false
          terraform -chdir=terraform/modules/environment test
      - name: Shell scripts
        run: shellcheck -S warning scripts/deploy.sh docker/*.sh docker-entrypoint.sh
