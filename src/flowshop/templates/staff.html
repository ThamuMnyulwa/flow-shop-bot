{% extends "base.html" %}
{% block content %}
<h1>Staff</h1>
<div class="card table-wrap">
<table>
  <tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr>
  {% for p in people %}
  <tr><td>{{ p.name }}</td><td>{{ p.email }}</td><td>{{ "admin" if p.is_admin else "staff" }}{% if not p.active %} <span class="pill bad">off</span>{% endif %}</td>
    <td>{% if p.id != staff.id %}<form method="post" action="/admin/staff/{{ p.id }}/toggle" class="inline"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="secondary">{{ "Switch off" if p.active else "Switch on" }}</button></form>{% endif %}</td></tr>
  {% endfor %}
</table>
</div>
<form method="post" action="/admin/staff" class="card">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <h2 style="margin-top:0">Add a staff member</h2>
  <div class="row">
    <div><label for="n">Name</label><input id="n" name="name" required></div>
    <div><label for="e">Email</label><input id="e" name="email" type="email" required></div>
  </div>
  <label for="p">Starting password (10 characters or more)</label><input id="p" name="password" type="password" minlength="10" required>
  <label><input type="checkbox" name="is_admin" value="true"> Admin: can change settings and staff</label>
  <div class="actions"><button>Add</button></div>
</form>
{% endblock %}
