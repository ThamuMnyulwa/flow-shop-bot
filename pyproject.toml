[project]
name = "flowshop"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "ThamuMnyulwa", email = "thamumnyulwa@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.8.0",
    "bcrypt>=5.0.0",
    "boto3>=1.44.3",
    "fastapi>=0.163.1",
    "holidays>=0.108",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.33",
    "pywa>=4.5.0",
    "sentry-sdk>=2.75.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
flowshop = "flowshop:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI dependencies use Depends() defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
